<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Runa y Piedra — Mazmorra Vóxel Cooperativa P2P</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <style>
    *,*:before,*:after{box-sizing:border-box}
    html,body{margin:0;padding:0;overflow:hidden;background:#05070d;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif}
    #canvas{display:block;width:100vw;height:100vh}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:20}
    #ui > *{pointer-events:auto}
    .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(15,23,42,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.12);color:#fff;padding:20px 20px;border-radius:18px;
      text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.75);width:90vw;max-width:350px;box-sizing:border-box}
    .menu h1{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:.8px;color:#f8fafc}
    .lobby-section{margin-bottom:12px;text-align:left}
    .lobby-label{font-size:10px;font-weight:700;letter-spacing:1px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;display:block}
    .name-input{width:100%;box-sizing:border-box;padding:10px 14px;font-size:15px;border-radius:10px;
      border:1px solid #334155;background:#0b1120;color:#fff;text-align:center;font-weight:600;outline:none;transition:border-color .2s}
    .name-input:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.25)}
    .heroes-row{display:flex;justify-content:center;gap:10px;margin:8px 0 6px}
    .hero-chip{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;
      transition:transform .15s,border-color .15s;box-shadow:0 2px 8px rgba(0,0,0,.4)}
    .hero-chip.selected{border-color:#fff;transform:scale(1.2);box-shadow:0 0 12px var(--hero-color)}
    .hero-chip:active{transform:scale(0.95)}
    .hero-badge{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:#38bdf8;margin-bottom:4px}
    .hero-trait-box{background:rgba(11,17,32,0.7);border-radius:9px;padding:8px 10px;margin-top:6px;text-align:left;border:1px solid #1e293b}
    .hero-role{font-size:11px;font-weight:700;letter-spacing:0.5px;margin-bottom:2px;display:flex;align-items:center;gap:4px}
    .hero-trait{font-size:11px;color:#94a3b8;line-height:1.3;margin-bottom:6px}
    .hero-stat-badges{display:flex;gap:5px;flex-wrap:wrap}
    .hero-stat{font-size:10px;font-weight:700;background:rgba(30,41,59,0.8);border-radius:6px;padding:2px 6px;color:#cbd5e1;display:inline-flex;align-items:center;gap:3px}
    .divider{height:1px;background:rgba(255,255,255,0.1);margin:12px 0}
    .btn-primary{width:100%;padding:12px 18px;font-size:15px;border:0;border-radius:11px;
      background:linear-gradient(135deg,#059669,#10b981);color:#fff;cursor:pointer;font-weight:700;
      box-shadow:0 4px 14px rgba(16,185,129,.35);transition:filter .15s;
      display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary:active{filter:brightness(0.9);transform:scale(0.98)}
    .join-container{display:flex;gap:8px;margin-top:10px;width:100%;box-sizing:border-box}
    .join-input{flex:1;min-width:0;width:100%;box-sizing:border-box;padding:10px 8px;font-size:15px;text-align:center;border-radius:10px;
      border:1px solid #334155;background:#0b1120;color:#fff;letter-spacing:3px;font-weight:700;outline:none;transition:border-color .2s}
    .join-input:focus{border-color:#3b82f6}
    .btn-join{padding:10px 16px;font-size:14px;border:0;border-radius:10px;background:#2563eb;
      color:#fff;cursor:pointer;font-weight:700;flex-shrink:0;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s}
    .btn-join:active{filter:brightness(0.9);transform:scale(0.98)}
    .status{margin-top:8px;font-size:12px;color:#94a3b8;min-height:16px}
    
    /* Sala de Host */
    .room-pin-display{font-size:36px;letter-spacing:8px;font-weight:800;color:#fbbf24;margin:4px 0;text-shadow:0 0 16px rgba(251,191,36,.4)}
    .share-btn{width:100%;padding:11px 16px;font-size:13px;border:0;border-radius:10px;
      background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;cursor:pointer;font-weight:700;
      display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;
      box-shadow:0 4px 12px rgba(37,211,102,.3);transition:filter .15s}
    .share-btn:active{filter:brightness(0.9);transform:scale(0.98)}
    .copy-btn{width:100%;padding:9px 14px;font-size:12px;border:1px solid #334155;border-radius:10px;
      background:#1e293b;color:#cbd5e1;cursor:pointer;font-weight:600;display:flex;
      align-items:center;justify-content:center;gap:6px;transition:background .15s}
    .copy-btn:hover{background:#334155}
    .party-box{margin:10px 0 12px;background:rgba(11,17,32,.7);border-radius:10px;padding:8px 12px;border:1px solid #1e293b;text-align:left}
    .party-title{font-size:10px;color:#94a3b8;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
    .party-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:4px 0}
    .party-member{display:flex;align-items:center;gap:6px}
    .party-dot{width:8px;height:8px;border-radius:50%}
    .party-badge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(16,185,129,.2);color:#34d399;font-weight:700}
    .btn-play{width:100%;padding:12px;font-size:14px;font-weight:700;border:0;border-radius:10px;
      background:linear-gradient(135deg,#d97706,#b45309);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(217,119,6,.35)}
    .btn-play:active{filter:brightness(0.9);transform:scale(0.98)}

    /* Botón y Modal de Configuración */
    .settings-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s, color 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
      color: #38bdf8;
    }
    .settings-btn:active {
      transform: scale(0.88);
      transition: transform 80ms ease-out;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .close-x-btn {
      background: transparent;
      border: 0;
      color: #94a3b8;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .close-x-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .settings-group {
      margin-bottom: 11px;
      text-align: left;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .quality-selector {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .quality-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #334155;
      background: #0b1120;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quality-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .level-btn-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      width: 100%;
    }
    .level-select-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #334155;
      background: #0b1120;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .level-select-btn:active {
      transform: scale(0.92);
      transition: transform 80ms ease-out;
    }
    .level-select-btn.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4);
    }
    .level-select-btn.active .level-btn-icon {
      color: #fff !important;
    }
    .btn-danger {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      transition: filter 0.15s;
    }
    .btn-danger:active {
      filter: brightness(0.9);
      transform: scale(0.98);
    }

    .crosshair{position:fixed;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
      border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 4px #000;pointer-events:none;z-index:15;display:none}
    .action-btn{position:fixed;width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);
      color:#fff;font-weight:700;font-size:11px;z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.25);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;user-select:none;cursor:pointer;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      transition:transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1),filter .15s,box-shadow .2s;
      will-change:transform;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;}
    .action-btn:active{transform:scale(0.86);transition:transform 80ms ease-out;filter:brightness(1.25);}
    .action-btn .ab-icon{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
    .action-btn .ab-label{font-size:10px;margin-top:2px;font-weight:800;letter-spacing:0.8px;
      text-shadow:0 1px 3px rgba(0,0,0,.6)}
    #btn-interact{right:max(24px, env(safe-area-inset-right));bottom:calc(max(140px, env(safe-area-inset-bottom)) + 10px);
      background:linear-gradient(160deg,rgba(217,119,6,.92),rgba(146,64,14,.92))}
    #btn-interact.dim{opacity:.45;filter:saturate(.5)}
    #btn-interact.ready{opacity:1;border-color:rgba(253,224,71,.9);
      box-shadow:0 0 18px rgba(251,191,36,.65),0 6px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.3);
      animation:interactPulse 1.2s ease-in-out infinite}
    @keyframes interactPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    #btn-jump{right:max(24px, env(safe-area-inset-right));bottom:max(48px, env(safe-area-inset-bottom));
      background:linear-gradient(160deg,rgba(107,114,128,.92),rgba(55,65,81,.92))}
    /* HUD de vidas (corazones) */
    #hud-lives{position:fixed;top:max(12px, env(safe-area-inset-top));left:max(12px, env(safe-area-inset-left));
      display:none;align-items:center;gap:4px;z-index:25;pointer-events:none;
      background:rgba(15,23,42,0.85);border:1px solid rgba(255,255,255,0.12);
      border-radius:12px;padding:7px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    #hud-lives .heart{font-size:18px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
      transition:transform .18s cubic-bezier(0.34,1.56,0.64,1), opacity .18s, filter .18s}
    #hud-lives .heart.lost{opacity:.28;filter:grayscale(1)}
    #hud-lives .heart.hurt{animation:heartShake .4s ease-out}
    #hud-lives .key-badge{font-size:18px;line-height:1;margin-left:4px;padding-left:6px;
      border-left:1px solid rgba(255,255,255,0.15);filter:drop-shadow(0 0 4px rgba(251,191,36,.7));
      animation:heartShake .4s ease-out}
    @keyframes heartShake{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-8deg)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
    #hud-lives.invuln{border-color:rgba(56,189,248,.6);box-shadow:0 0 12px rgba(56,189,248,.35)}
    /* Velo de transición del portal entre mazmorras (fade negro + nombre, estilo Dark Souls) */
    #level-transition{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding:24px;
      background:#020617;
      opacity:0;transition:opacity 1.4s ease;pointer-events:none}
    #level-transition.visible{opacity:1}
    #level-transition .portal-title{font-size:27px;font-weight:800;color:#f8fafc;
      letter-spacing:1.5px;margin-bottom:10px;font-family:Georgia,'Times New Roman',serif}
    #level-transition .portal-sub{font-size:13px;color:#94a3b8;max-width:320px;line-height:1.5;
      letter-spacing:.5px}
    #level-transition.victory .portal-title{color:#fde68a;text-shadow:0 0 22px rgba(251,191,36,.55)}
    /* Tarjeta de descenso sincronizado (8s) */
    #descent-card{position:fixed;top:calc(max(12px, env(safe-area-inset-top)) + 64px);left:50%;
      transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;
      gap:6px;background:rgba(15,23,42,.94);border:1px solid rgba(251,191,36,.55);
      border-radius:14px;padding:12px 18px;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.6);
      animation:alertSlideDown .25s cubic-bezier(.16,1,.3,1) forwards;text-align:center}
    #descent-card .descent-title{font-size:13px;font-weight:800;color:#fbbf24}
    #descent-card .descent-timer{font-size:30px;font-weight:800;color:#fff;line-height:1;
      text-shadow:0 0 12px rgba(251,191,36,.6)}
    #descent-card .descent-sub{font-size:11px;color:#94a3b8}
    #btn-descend-now{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);
      z-index:36;min-width:230px;padding:17px 44px;font-size:17px;font-weight:800;letter-spacing:1.5px;
      border:2px solid rgba(253,224,71,.85);border-radius:16px;cursor:pointer;color:#fff;
      background:linear-gradient(160deg,rgba(217,119,6,.95),rgba(146,64,14,.95));
      box-shadow:0 0 26px rgba(251,191,36,.55),0 8px 28px rgba(0,0,0,.6);
      animation:descendPulse 1.1s ease-in-out infinite;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #btn-descend-now:active{transform:translate(-50%,-50%) scale(.94);filter:brightness(1.2)}
    @keyframes descendPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
    /* Contenedor y Pila en Lista para Alertas y Mensajes Narrativos */
    #hud-message {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - 110px);
      max-width: 350px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 25;
      pointer-events: none;
    }
    .hud-alert-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(217, 119, 6, 0.55);
      border-radius: 12px;
      padding: 9px 12px;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      /* Curva ease-out-expo asintótica (alta suavidad perceptual sin rebase) */
      animation: alertSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: auto;
      box-sizing: border-box;
      text-align: left;
    }
    .hud-alert-card.fade-out {
      animation: alertFadeOut 0.22s ease-out forwards;
    }
    @keyframes alertSlideDown {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes alertFadeOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-6px) scale(0.97); }
    }
    .hud-alert-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      line-height: 1.3;
    }
    .hud-alert-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 5px;
    }
    .hud-alert-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
      word-break: break-word;
    }
    .hud-alert-bullet {
      color: #fbbf24;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .svg-icon{display:inline-block;vertical-align:middle;flex-shrink:0}
    .narrative-icon{display:inline-block;vertical-align:-3px;flex-shrink:0;margin:0 3px}

    /* =============== SPRING POP-IN (overshoot único) =============== */
    @keyframes springPopIn {
      0%   { transform: scale(0.0) translateY(8px); opacity: 0; }
      55%  { transform: scale(1.15) translateY(-2px); opacity: 1; }
      75%  { transform: scale(0.96) translateY(0); }
      100% { transform: scale(1.0) translateY(0); opacity: 1; }
    }

    /* =============== SPRING BOUNCE (2-3 oscilaciones) =============== */
    @keyframes springBounce {
      0%   { transform: scale(0.0); opacity: 0; }
      40%  { transform: scale(1.28); opacity: 1; }
      60%  { transform: scale(0.88); }
      75%  { transform: scale(1.08); }
      88%  { transform: scale(0.97); }
      100% { transform: scale(1.0); }
    }

    /* Selectores duales: cubren iconos de HUD y de texto narrativo */
    .svg-icon.pop-in,
    .narrative-icon.pop-in {
      animation: springPopIn 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    .svg-icon.reward,
    .narrative-icon.reward {
      animation: springBounce 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    /* Retira will-change al terminar para liberar la capa GPU */
    .svg-icon.pop-in,
    .svg-icon.reward,
    .narrative-icon.pop-in,
    .narrative-icon.reward {
      animation-fill-mode: forwards;
    }
    .svg-icon.pop-in.done,
    .svg-icon.reward.done,
    .narrative-icon.pop-in.done,
    .narrative-icon.reward.done {
      will-change: auto;
    }
    #qr-canvas{border-radius:8px;margin:6px auto;background:#fff;padding:4px;display:block}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="btn-settings" class="settings-btn" title="Configuración">
