<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Voxel Sandbox P2P</title>
  <style>
    html,body{margin:0;padding:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif}
    #canvas{display:block;width:100vw;height:100vh}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:20}
    #ui > *{pointer-events:auto}
    .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(10,12,20,.9);color:#fff;padding:24px 28px;border-radius:14px;
      text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:240px;max-width:320px}
    .menu h1{margin:0 0 16px;font-size:18px;letter-spacing:.5px}
    .menu button{padding:12px 20px;margin:4px;font-size:15px;border:0;border-radius:10px;
      background:#4caf50;color:#fff;cursor:pointer;font-weight:600}
    .menu button:hover{filter:brightness(1.1)}
    .menu input{padding:11px;font-size:16px;width:88px;text-align:center;border-radius:10px;
      border:1px solid #333;background:#181a24;color:#fff;letter-spacing:4px}
    .status{margin-top:12px;font-size:12px;color:#999;min-height:16px}
    .crosshair{position:fixed;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
      border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 4px #000;pointer-events:none;z-index:15;display:none}
    .action-btn{position:fixed;width:76px;height:76px;border-radius:50%;border:0;
      color:#fff;font-weight:700;font-size:13px;z-index:25;box-shadow:0 4px 16px rgba(0,0,0,.5);
      display:none;align-items:center;justify-content:center;user-select:none}
    #btn-place{right:120px;bottom:110px;background:#3b82f6}
    #btn-destroy{right:30px;bottom:170px;background:#ef4444}
    #btn-jump{right:30px;bottom:60px;background:#6b7280}
    #qr-canvas{border-radius:8px;margin:8px 0;background:#fff;padding:4px}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="crosshair" id="crosshair"></div>
  <button class="action-btn" id="btn-place">PONER</button>
  <button class="action-btn" id="btn-destroy">ROMPER</button>
  <button class="action-btn" id="btn-jump">SALTAR</button>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
