<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Runa y Piedra — Mazmorra Vóxel Cooperativa P2P</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="btn-dev" class="dev-btn" title="Herramientas de Desarrollador" aria-label="Dev Tools">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"/>
      <line x1="12" y1="19" x2="20" y2="19"/>
    </svg>
  </button>
  <button id="btn-settings" class="settings-btn" title="Configuración" style="display:none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <button id="btn-mute" class="hud-btn mute-btn" title="Micrófono (Chat de Voz)" aria-label="Micrófono" style="display:none">
    <svg class="icon-mic-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <svg class="icon-mic-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
      <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <div class="crosshair" id="crosshair"></div>
  <div id="hud-top-left" class="hud-top-left">
    <div class="hud-top-row">
      <button id="hud-inventory" class="hud-inventory-btn" type="button" title="Inventario de Botín (B)" aria-label="Inventario">
        <span class="inv-btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V10l2-2h12l2 2v11M3 21h18M9 21v-4a3 3 0 0 1 6 0v4M4 7V4h3v3h2V4h2v3h2V4h2v3h2V4h3v3"/></svg>
        </span>
      </button>
      <div id="hud-lives" title="Vidas"></div>
    </div>
    <div id="tutorial-controls-hud" class="tutorial-controls-hud">
      <div class="hud-controls-header">
        <div class="hud-controls-title"><svg class="svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1" fill="#a855f7"/><circle cx="18" cy="11" r="1" fill="#a855f7"/></svg>CONTROLES <span class="hud-controls-hint-kbd">[H]</span></div>
        <button id="btn-close-controls" class="hud-controls-close-btn" type="button" title="Ocultar controles (H)" aria-label="Cerrar panel de controles">×</button>
      </div>
      <!-- Versión PC -->
      <div class="hud-pc-controls">
        <div class="hud-control-row">
          <span class="hud-kbd-group">
            <span class="hud-kbd">W</span><span class="hud-kbd">A</span><span class="hud-kbd">S</span><span class="hud-kbd">D</span>
          </span>
          <span class="hud-control-desc">Moverse</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd hud-kbd-space">Espacio</span>
          <span class="hud-control-desc">Saltar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd">E</span><span style="opacity:0.5;font-size:9px;">/</span><span class="hud-kbd">F</span>
          <span class="hud-control-desc">Acción / Bajar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd">B</span>
          <span class="hud-control-desc">Ver Botín</span>
        </div>
      </div>
      <!-- Versión Táctil (Móvil / Tablet) -->
      <div class="hud-touch-controls">
        <div class="hud-control-row">
          <span class="hud-touch-pill"><svg class="svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px;"><path d="M5 19a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5v-2z"/><circle cx="12" cy="6" r="3"/><line x1="12" y1="9" x2="12" y2="17"/></svg>Joystick</span>
          <span class="hud-control-desc">Moverse</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill">SALTAR</span>
          <span class="hud-control-desc">Brincar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill hud-pill-action">USAR</span>
          <span class="hud-control-desc">Acción / Bajar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill"><svg class="svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px;"><path d="M3 10c0-4.5 4-6.5 9-6.5s9 2 9 6.5v1H3v-1zM3 11v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8H3zM7 5.5v15.5M17 5.5v15.5M10 10h4v4h-4z"/><circle cx="12" cy="12" r="0.6" fill="#f59e0b"/></svg>BOTÍN</span>
          <span class="hud-control-desc">Tocar para abrir</span>
        </div>
      </div>
    </div>
  </div>
  <div id="level-transition"></div>
  <div id="pc-hint" class="input-hint">
    <strong>WASD</strong> mover · <strong>Espacio</strong> saltar · <strong>E</strong> interactuar · <strong>B</strong> botín · <strong>H</strong> controles
  </div>
  <button class="action-btn dim" id="btn-interact" title="Interactuar">
    <span class="ab-icon" id="interact-icon"><svg class="svg-icon" width="24" height="24" viewBox="0 0 24 24" fill="#fde68a" stroke="none"><path d="M12 2l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16l-5.8 3.7 1.6-6.6L2.7 8.7l6.7-.5L12 2z"/></svg></span>
    <span class="ab-label" id="interact-label">USAR</span>
  </button>
  <button class="action-btn" id="btn-jump" title="Saltar">
    <span class="ab-icon"><svg class="svg-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><polyline points="18 15 12 9 6 15" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="21" stroke-linecap="round"/></svg></span>
    <span class="ab-label">SALTAR</span>
  </button>
  <div id="ui"></div>
  <div id="hud-message"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
