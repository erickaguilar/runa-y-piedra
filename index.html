<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Voxel Sandbox P2P</title>
  <style>
    html,body{margin:0;padding:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif}
    #canvas{display:block;width:100vw;height:100vh}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:20}
    #ui > *{pointer-events:auto}
    .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(10,12,20,.9);color:#fff;padding:24px 28px;border-radius:14px;
      text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.6);min-width:240px;max-width:320px}
    .menu h1{margin:0 0 16px;font-size:18px;letter-spacing:.5px}
    .menu button{padding:12px 20px;margin:4px;font-size:15px;border:0;border-radius:10px;
      background:#4caf50;color:#fff;cursor:pointer;font-weight:600}
    .menu button:hover{filter:brightness(1.1)}
    .menu input{padding:11px;font-size:16px;width:88px;text-align:center;border-radius:10px;
      border:1px solid #333;background:#181a24;color:#fff;letter-spacing:4px}
    .status{margin-top:12px;font-size:12px;color:#999;min-height:16px}
    .crosshair{position:fixed;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
      border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 4px #000;pointer-events:none;z-index:15;display:none}
    .action-btn{position:fixed;width:72px;height:72px;border-radius:50%;border:0;
      color:#fff;font-weight:700;font-size:11px;z-index:25;box-shadow:0 4px 16px rgba(0,0,0,.5);
      display:none;flex-direction:column;align-items:center;justify-content:center;user-select:none;cursor:pointer}
    .action-btn:active{transform:scale(0.92)}
    #btn-place{right:120px;bottom:110px;background:#3b82f6}
    #btn-destroy{right:30px;bottom:170px;background:#ef4444}
    #btn-jump{right:30px;bottom:60px;background:#6b7280}
    #qr-canvas{border-radius:8px;margin:8px 0;background:#fff;padding:4px}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="crosshair" id="crosshair"></div>
  <button class="action-btn" id="btn-place">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
      <line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
    <span style="font-size:10px;margin-top:2px;">PONER</span>
  </button>
  <button class="action-btn" id="btn-destroy">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4l5.5 5.5-3 3-5.5-5.5 3-3z"/>
      <path d="M12 7.5L5 14.5a2.121 2.121 0 0 0 0 3l1.5 1.5a2.121 2.121 0 0 0 3 0L16.5 12"/>
      <line x1="18" y1="15" x2="15" y2="12"/>
    </svg>
    <span style="font-size:10px;margin-top:2px;">ROMPER</span>
  </button>
  <button class="action-btn" id="btn-jump">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
      <line x1="12" y1="9" x2="12" y2="21"/>
    </svg>
    <span style="font-size:10px;margin-top:2px;">SALTAR</span>
  </button>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
