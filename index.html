<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>3D Mobile Voxel Sandbox P2P</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
      <!-- Performance Stats & Info -->
      <div id="perf-hud">
        <span id="fps-counter">60 FPS</span> | 
        <span id="draw-calls">Calls: 1</span> | 
        <span id="tri-count">Tris: 0</span> | 
        <span id="ping-hud">P2P: Offline</span>
      </div>

      <!-- Lobby / Room Connection Panel -->
      <div id="lobby-panel" class="panel">
        <h1 class="title">Voxel Arena 3D</h1>
        <p class="subtitle">Sandbox P2P WebGL 2.0 (60 FPS)</p>
        
        <div class="actions">
          <button id="btn-create-room" class="btn btn-primary">Crear Sala (Host)</button>
          
          <div class="join-box">
            <input type="text" id="input-room-code" placeholder="PIN de Sala (ej. 4321)" maxlength="6" />
            <button id="btn-join-room" class="btn btn-secondary">Unirse</button>
          </div>
        </div>

        <div id="room-status" class="room-status hidden"></div>
      </div>

      <!-- QR Code Share Modal -->
      <div id="qr-modal" class="panel hidden">
        <h2 class="title" style="font-size: 20px;">Invitar Jugador</h2>
        <p class="subtitle" style="margin-bottom: 12px;">Escanea este código con la cámara de tu celular para unirte instantáneamente:</p>
        
        <div id="qr-container">
          <canvas id="qr-canvas"></canvas>
        </div>

        <p id="qr-pin-text" style="font-size: 16px; font-weight: 700; margin: 10px 0; color: #38bdf8;"></p>
        <p id="qr-link-text" style="font-size: 11px; word-break: break-all; color: #94a3b8; margin-bottom: 14px;"></p>

        <button id="btn-close-qr" class="btn btn-primary" style="width: 100%;">Entrar a la Partida</button>
      </div>

      <!-- In-Game Mobile Touch Controls -->
      <div id="touch-controls" class="hidden">
        <!-- Left half: Nipple.js Joystick Zone -->
        <div id="joystick-zone"></div>

        <!-- Right half: Camera Look Zone -->
        <div id="camera-zone"></div>

        <!-- Floating Action Buttons -->
        <div id="action-buttons">
          <button id="btn-jump" class="touch-btn">SALTO</button>
          <button id="btn-break" class="touch-btn" style="border-color: #f43f5e; color: #fda4af;">ROMPER</button>
          <button id="btn-place" class="touch-btn" style="border-color: #38bdf8; color: #bae6fd;">COLOCAR</button>
        </div>
      </div>

      <!-- Crosshair / Reticle for Block Interaction -->
      <div id="reticle" class="hidden">+</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
