<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Runa y Piedra — Mazmorra Vóxel Cooperativa P2P</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <style>
    *,*:before,*:after{box-sizing:border-box}
    /* Scrollbars personalizados - Estética Dark Fantasy / Runa y Piedra */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.35) rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 17, 32, 0.5);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.35), rgba(99, 102, 241, 0.4));
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.65), rgba(99, 102, 241, 0.7));
      border-color: rgba(56, 189, 248, 0.4);
    }
    ::-webkit-scrollbar-thumb:active {
      background: linear-gradient(180deg, #f59e0b, #d97706);
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    html,body{margin:0;padding:0;overflow:hidden;background:#05070d;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,sans-serif}
    #canvas{display:block;width:100vw;height:100vh}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:35}
    #ui > *{pointer-events:auto}
    .menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(15,23,42,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.12);color:#fff;padding:20px 20px;border-radius:18px;
      text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.75);width:90vw;max-width:350px;box-sizing:border-box;
      max-height:92vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    #modal-settings{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .menu h1{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:.8px;color:#f8fafc}
    .lobby-section{margin-bottom:12px;text-align:left}
    .lobby-label{font-size:10px;font-weight:700;letter-spacing:1px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;display:block}
    .name-input{width:100%;box-sizing:border-box;padding:10px 14px;font-size:15px;border-radius:10px;
      border:1px solid #334155;background:#0b1120;color:#fff;text-align:center;font-weight:600;outline:none;transition:border-color .2s}
    .name-input:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.25)}
    .heroes-row{display:flex;justify-content:center;gap:10px;margin:8px 0 6px}
    .hero-chip{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;
      transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(0,0,0,.4);
      position:relative;display:inline-flex;align-items:center;justify-content:center}
    .hero-chip svg{pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
    .hero-chip.selected{border-color:#fff;transform:scale(1.18);box-shadow:0 0 14px var(--hero-color),inset 0 0 4px rgba(255,255,255,.3)}
    .hero-chip:hover:not(.occupied){transform:scale(1.08)}
    .hero-chip.selected:hover{transform:scale(1.2)}
    .hero-chip.occupied{opacity:0.35;filter:grayscale(0.85);cursor:not-allowed}
    .hero-chip.occupied::after{content:'✕';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      font-size:15px;color:#ef4444;font-weight:900;text-shadow:0 0 4px #000}
    .hero-chip:active:not(.occupied){transform:scale(0.95)}
    .party-count-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:rgba(15,23,42,0.7);border:1px solid rgba(255,255,255,0.08)}
    .hero-badge{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:#38bdf8;margin-bottom:4px}
    .hero-trait-box{background:rgba(11,17,32,0.7);border-radius:9px;padding:8px 10px;margin-top:6px;text-align:left;border:1px solid #1e293b}
    .hero-role{font-size:11px;font-weight:700;letter-spacing:0.5px;margin-bottom:2px;display:flex;align-items:center;gap:4px}
    .hero-trait{font-size:11px;color:#94a3b8;line-height:1.3;margin-bottom:6px}
    .hero-stat-badges{display:flex;gap:5px;flex-wrap:wrap}
    .hero-stat{font-size:10px;font-weight:700;background:rgba(30,41,59,0.8);border-radius:6px;padding:2px 6px;color:#cbd5e1;display:inline-flex;align-items:center;gap:3px}
    .divider{height:1px;background:rgba(255,255,255,0.1);margin:12px 0}
    .btn-primary{width:100%;padding:12px 18px;font-size:15px;border:0;border-radius:11px;
      background:linear-gradient(135deg,#059669,#10b981);color:#fff;cursor:pointer;font-weight:700;
      box-shadow:0 4px 14px rgba(16,185,129,.35);transition:filter .15s;
      display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary:active{filter:brightness(0.9);transform:scale(0.98)}
    .join-container{display:flex;gap:8px;margin-top:10px;width:100%;box-sizing:border-box}
    .join-input{flex:1;min-width:0;width:100%;box-sizing:border-box;padding:10px 8px;font-size:15px;text-align:center;border-radius:10px;
      border:1px solid #334155;background:#0b1120;color:#fff;letter-spacing:3px;font-weight:700;outline:none;transition:border-color .2s}
    .join-input:focus{border-color:#3b82f6}
    .btn-join{padding:10px 16px;font-size:14px;border:0;border-radius:10px;background:#2563eb;
      color:#fff;cursor:pointer;font-weight:700;flex-shrink:0;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s}
    .btn-join:active{filter:brightness(0.9);transform:scale(0.98)}
    .status{margin-top:8px;font-size:12px;color:#94a3b8;min-height:16px}
    
    /* Sala de Host */
    .room-pin-display{font-size:36px;letter-spacing:8px;font-weight:800;color:#fbbf24;margin:4px 0;text-shadow:0 0 16px rgba(251,191,36,.4)}
    .share-btn{width:100%;padding:11px 16px;font-size:13px;border:0;border-radius:10px;
      background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;cursor:pointer;font-weight:700;
      display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;
      box-shadow:0 4px 12px rgba(37,211,102,.3);transition:filter .15s}
    .share-btn:active{filter:brightness(0.9);transform:scale(0.98)}
    .copy-btn{width:100%;padding:9px 14px;font-size:12px;border:1px solid #334155;border-radius:10px;
      background:#1e293b;color:#cbd5e1;cursor:pointer;font-weight:600;display:flex;
      align-items:center;justify-content:center;gap:6px;transition:background .15s}
    .copy-btn:hover{background:#334155}
    .party-box{margin:10px 0 12px;background:rgba(11,17,32,.7);border-radius:10px;padding:8px 12px;border:1px solid #1e293b;text-align:left}
    .party-title{font-size:10px;color:#94a3b8;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
    .party-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:4px 0}
    .party-member{display:flex;align-items:center;gap:6px}
    .party-dot{width:8px;height:8px;border-radius:50%}
    .party-badge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(16,185,129,.2);color:#34d399;font-weight:700}
    .btn-play{width:100%;padding:12px;font-size:14px;font-weight:700;border:0;border-radius:10px;
      background:linear-gradient(135deg,#d97706,#b45309);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(217,119,6,.35)}
    .btn-play:active{filter:brightness(0.9);transform:scale(0.98)}

    /* Botón y Modal de Configuración */
    .settings-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s, color 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
      color: #38bdf8;
    }
    .settings-btn:active {
      transform: scale(0.88);
      transition: transform 80ms ease-out;
    }

    /* Botón de Herramientas de Desarrollador (aparece exclusivamente en modo desarrollo) */
    .dev-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: calc(max(16px, env(safe-area-inset-right)) + 52px);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(16, 185, 129, 0.45);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #34d399;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 12px rgba(16, 185, 129, 0.18);
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .dev-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(52, 211, 153, 0.85);
      color: #6ee7b7;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }
    .dev-btn:active {
      transform: scale(0.88);
      transition: transform 80ms ease-out;
    }
    .dev-btn.is-dev {
      display: flex;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .settings-version-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 9999px;
      padding: 1px 7px;
      display: inline-flex;
      align-items: center;
      line-height: 1.4;
    }
    .close-x-btn {
      background: transparent;
      border: 0;
      color: #94a3b8;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .close-x-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .settings-group {
      margin-bottom: 11px;
      text-align: left;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .quality-selector {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .quality-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #334155;
      background: #0b1120;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quality-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .level-btn-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      width: 100%;
    }
    .level-select-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #334155;
      background: #0b1120;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .level-select-btn:active {
      transform: scale(0.92);
      transition: transform 80ms ease-out;
    }
    .level-select-btn.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 2px 10px rgba(217, 119, 6, 0.4);
    }
    .level-select-btn.active .level-btn-icon {
      color: #fff !important;
    }
    .btn-danger {
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      background: #dc2626;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      transition: filter 0.15s;
    }
    .btn-danger:active {
      filter: brightness(0.9);
      transform: scale(0.98);
    }
    .settings-footer-version {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.4px;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Modal de Confirmación Personalizado (In-Game Alert / Confirm Dialog) */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      animation: hintFadeIn 0.18s ease-out;
      pointer-events: auto;
    }
    .confirm-modal {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 22px 20px;
      width: 90vw;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 24px rgba(245, 158, 11, 0.15);
      box-sizing: border-box;
      animation: springPopIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .confirm-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }
    .confirm-icon-box.danger {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.25);
    }
    .confirm-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .confirm-message {
      margin: 0 0 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .confirm-actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: background 0.15s, color 0.15s, transform 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .btn-secondary:active {
      transform: scale(0.96);
    }

    .crosshair{position:fixed;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
      border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 4px #000;pointer-events:none;z-index:15;display:none}
    .action-btn{position:fixed;width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);
      color:#fff;font-weight:700;font-size:11px;z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.25);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;user-select:none;cursor:pointer;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      transition:transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1),filter .15s,box-shadow .2s;
      will-change:transform;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;}
    .action-btn:active{transform:scale(0.86);transition:transform 80ms ease-out;filter:brightness(1.25);}
    .action-btn .ab-icon{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
    .action-btn .ab-label{font-size:10px;margin-top:2px;font-weight:800;letter-spacing:0.8px;
      text-shadow:0 1px 3px rgba(0,0,0,.6)}
    #btn-interact{right:max(24px, env(safe-area-inset-right));bottom:calc(max(140px, env(safe-area-inset-bottom)) + 10px);
      background:linear-gradient(160deg,rgba(217,119,6,.92),rgba(146,64,14,.92))}
    #btn-interact.dim{opacity:.45;filter:saturate(.5)}
    #btn-interact.ready{opacity:1;border-color:rgba(253,224,71,.9);
      box-shadow:0 0 18px rgba(251,191,36,.65),0 6px 20px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,0.3);
      animation:interactPulse 1.2s ease-in-out infinite}
    @keyframes interactPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    #btn-jump{right:max(24px, env(safe-area-inset-right));bottom:max(48px, env(safe-area-inset-bottom));
      background:linear-gradient(160deg,rgba(107,114,128,.92),rgba(55,65,81,.92))}

    /* Adaptabilidad de controles según el modo de entrada (InputMode) */
    body.input-pc .action-btn,
    body.input-pc #joystick-zone {
      display: none !important;
    }
    body.input-pc .crosshair {
      display: block;
    }
    body.input-touch .crosshair {
      display: none !important;
    }

    /* Cartel flotante de controles para PC */
    .input-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background: rgba(10, 12, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      color: #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: none;
      pointer-events: none;
      z-index: 40;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .input-hint strong {
      color: #38bdf8;
      font-weight: 700;
    }
    body.input-pc .input-hint.shown {
      display: block;
      animation: hintFadeIn 0.35s ease-out;
    }
    @keyframes hintFadeIn {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    /* Contenedor HUD Superior Izquierdo: Vidas + Inventario + Guía */
    .hud-top-left {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 25;
      pointer-events: none;
      align-items: flex-start;
    }
    /* Fila superior HUD: Botón Icono de Inventario + Vidas (corazones) */
    .hud-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .hud-top-row > * {
      pointer-events: auto;
    }

    /* Icon Botón de inventario (a la izquierda de los corazones) */
    #hud-inventory,
    .hud-inventory-btn {
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      box-sizing: border-box;
      outline: none;
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      animation: hintFadeIn 0.25s ease-out;
    }
    #hud-inventory * {
      pointer-events: none;
    }
    #hud-inventory:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(251, 191, 36, 0.6);
      color: #fbbf24;
      box-shadow: 0 4px 18px rgba(251, 191, 36, 0.25);
      transform: translateY(-1px);
    }
    #hud-inventory:active {
      transform: scale(0.90);
    }
    #hud-inventory.has-loot {
      border-color: rgba(245, 158, 11, 0.55);
      color: #fbbf24;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.28);

    #hud-inventory.has-loot .inv-btn-icon {

    .inv-btn-icon {

      justify-content: center;
      transition: transform 0.15s ease;
    }
    #hud-inventory:hover .inv-btn-icon {
      transform: scale(1.1);

    .inv-btn-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9999px;

    /* HUD de vidas (corazones) */
    /* HUD de vidas (corazones, llaves y gemas) */
    #hud-lives {
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(255,255,255,0.12);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

    #hud-lives .heart{

      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
      transition: transform .18s cubic-bezier(0.34,1.56,0.64,1), opacity .18s, filter .18s;
    }
    #hud-lives .heart.lost{
      opacity: 0.55;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
    #hud-lives .heart.hurt{animation:heartShake .4s ease-out}
    #hud-lives .key-badge{
      display: inline-flex;
      align-items: center;
      font-size: 18px;
      line-height: 1;
      margin-left: 4px;

    #hud-lives .gems-badge{

      margin-left: 4px;

    @keyframes heartShake{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-8deg)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
    #hud-lives.invuln{border-color:rgba(56,189,248,.6);box-shadow:0 0 12px rgba(56,189,248,.35)}
    .inv-header {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #94a3b8;

      align-items: center;

    .inv-slot {

    /* Modal de Inventario / Botín */
    .inventory-modal {

    .inv-section-title {

    .inv-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .inv-detail-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(11, 17, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

    .inv-detail-card:hover {

    .inv-detail-icon {
      width: 40px;
      height: 40px;

      align-items: center;
      justify-content: center;

    .inv-detail-icon.key-bg {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .inv-detail-icon.gem-bg {
      background: rgba(56, 189, 248, 0.16);

    }
    .inv-detail-icon.relic-bg {
      background: rgba(234, 179, 8, 0.18);
      border: 1px solid rgba(234, 179, 8, 0.4);
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.2);
    }
    .inv-detail-info {
      flex: 1;

    }
    .inv-detail-name {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;

    }
    .inv-detail-desc {
      font-size: 10px;
      color: #94a3b8;

    }
    .inv-status-pill {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 9999px;
      flex-shrink: 0;
    }
    .inv-status-pill.key {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .inv-status-pill.gem {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }
    .inv-status-pill.relic {
      background: rgba(234, 179, 8, 0.25);
      border: 1px solid rgba(234, 179, 8, 0.5);
      color: #fef08a;
      box-shadow: 0 0 8px rgba(234, 179, 8, 0.25);
    }
    .inv-modal-empty {
      background: rgba(11, 17, 32, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    .inv-modal-empty-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    /* Guía de controles bajo el inventario en la mazmorra tutorial */
    #tutorial-controls-hud {
      display: none;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      animation: hintFadeIn 0.3s ease-out;
    }
    .hud-controls-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud-control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      line-height: 1.2;
    }
    .hud-control-desc {
      font-weight: 600;
      color: #94a3b8;
      font-size: 11px;
    }
    .hud-kbd-group {
      display: inline-flex;
      gap: 2px;
    }
    .hud-kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 19px;
      height: 19px;
      padding: 0 4px;
      font-size: 10px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #f8fafc;
      background: #1e293b;
      border: 1px solid #475569;
      border-bottom: 2px solid #334155;
      border-radius: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .hud-kbd-space {
      min-width: 48px;
    }
    .hud-touch-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(51, 65, 85, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
    }
    .hud-pill-action {
      background: rgba(217, 119, 6, 0.85);
      color: #fef3c7;
      border-color: rgba(245, 158, 11, 0.5);
    }
    .hud-pc-controls,
    .hud-touch-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    body.input-pc .hud-pc-controls { display: flex; }
    body.input-pc .hud-touch-controls { display: none !important; }
    body.input-touch .hud-pc-controls { display: none !important; }
    body.input-touch .hud-touch-controls { display: flex; }

    /* Velo de transición del portal entre mazmorras (fade negro + nombre, estilo Dark Souls) */
    #level-transition{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding:24px;
      background:#020617;
      opacity:0;transition:opacity 1.4s ease;pointer-events:none}
    #level-transition.visible{opacity:1}
    #level-transition.victory{pointer-events:auto;background:radial-gradient(ellipse at center, rgba(15,23,42,.92) 0%, rgba(2,6,23,.98) 100%)}
    #level-transition .portal-title{font-size:27px;font-weight:800;color:#f8fafc;
      letter-spacing:1.5px;margin-bottom:10px;font-family:Georgia,'Times New Roman',serif}
    #level-transition .portal-sub{font-size:13px;color:#94a3b8;max-width:320px;line-height:1.5;
      letter-spacing:.5px}
    /* Tarjeta de descenso sincronizado (5s) */
    #descent-card{position:fixed;top:max(16px, env(safe-area-inset-top));left:50%;
      transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;align-items:center;
      gap:6px;background:rgba(15,23,42,.96);border:1px solid rgba(251,191,36,.65);
      border-radius:14px;padding:12px 20px;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.7), 0 0 16px rgba(251,191,36,.25);
      animation:alertSlideDown .25s cubic-bezier(.16,1,.3,1) forwards;text-align:center}
    #descent-card .descent-title{font-size:13px;font-weight:800;color:#fbbf24}
    #descent-card .descent-timer{font-size:30px;font-weight:800;color:#fff;line-height:1;
      text-shadow:0 0 12px rgba(251,191,36,.6)}
    #descent-card .descent-sub{font-size:11px;color:#94a3b8}
    #btn-descend-now{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);
      z-index:9999;min-width:230px;padding:17px 44px;font-size:17px;font-weight:800;letter-spacing:1.5px;
      border:2px solid rgba(253,224,71,.85);border-radius:16px;cursor:pointer;color:#fff;
      background:linear-gradient(160deg,rgba(217,119,6,.95),rgba(146,64,14,.95));
      box-shadow:0 0 26px rgba(251,191,36,.55),0 8px 28px rgba(0,0,0,.6);
      animation:descendPulse 1.1s ease-in-out infinite;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #btn-descend-now:active{transform:translate(-50%,-50%) scale(.94);filter:brightness(1.2)}
    @keyframes descendPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
    /* Contenedor y Pila en Lista para Alertas y Mensajes Narrativos (por encima de todo) */
    #hud-message {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100vw - 110px);
      max-width: 380px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 9999;
      pointer-events: none;
    }
    .hud-alert-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(217, 119, 6, 0.65);
      border-radius: 12px;
      padding: 9px 12px;
      color: #fff;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.75), 0 0 14px rgba(245, 158, 11, 0.25);
      /* Curva ease-out-expo asintótica (alta suavidad perceptual sin rebase) */
      animation: alertSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: auto;
      box-sizing: border-box;
      text-align: left;
      cursor: pointer;
    }
    .hud-alert-card.fade-out {
      animation: alertFadeOut 0.22s ease-out forwards;
    }
    @keyframes alertSlideDown {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes alertFadeOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-6px) scale(0.97); }
    }
    .hud-alert-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      line-height: 1.3;
    }
    .hud-alert-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 5px;
    }
    .hud-alert-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
      word-break: break-word;
    }
    .hud-alert-bullet {
      color: #fbbf24;
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .svg-icon{display:inline-block;vertical-align:middle;flex-shrink:0}
    .narrative-icon{display:inline-block;vertical-align:-3px;flex-shrink:0;margin:0 3px}

    /* =============== SPRING POP-IN (overshoot único) =============== */
    @keyframes springPopIn {
      0%   { transform: scale(0.0) translateY(8px); opacity: 0; }
      55%  { transform: scale(1.15) translateY(-2px); opacity: 1; }
      75%  { transform: scale(0.96) translateY(0); }
      100% { transform: scale(1.0) translateY(0); opacity: 1; }
    }

    /* =============== SPRING BOUNCE (2-3 oscilaciones) =============== */
    @keyframes springBounce {
      0%   { transform: scale(0.0); opacity: 0; }
      40%  { transform: scale(1.28); opacity: 1; }
      60%  { transform: scale(0.88); }
      75%  { transform: scale(1.08); }
      88%  { transform: scale(0.97); }
      100% { transform: scale(1.0); }
    }

    /* Selectores duales: cubren iconos de HUD y de texto narrativo */
    .svg-icon.pop-in,
    .narrative-icon.pop-in {
      animation: springPopIn 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    .svg-icon.reward,
    .narrative-icon.reward {
      animation: springBounce 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity;
    }

    /* Retira will-change al terminar para liberar la capa GPU */
    .svg-icon.pop-in,
    .svg-icon.reward,
    .narrative-icon.pop-in,
    .narrative-icon.reward {
      animation-fill-mode: forwards;
    }
    .svg-icon.pop-in.done,
    .svg-icon.reward.done,
    .narrative-icon.pop-in.done,
    .narrative-icon.reward.done {
      will-change: auto;
    }
    #qr-canvas{border-radius:8px;margin:6px auto;background:#fff;padding:4px;display:block}
  </style>
</head>

      <button id="hud-inventory" class="hud-inventory-btn" type="button" title="Inventario de Botín (B)" aria-label="Inventario">
        <span class="inv-btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V10l2-2h12l2 2v11M3 21h18M9 21v-4a3 3 0 0 1 6 0v4M4 7V4h3v3h2V4h2v3h2V4h2v3h2V4h3v3"/></svg>
        </span>
      </button>
      <div id="hud-lives" title="Vidas"></div>
    </div>
    <div id="tutorial-controls-hud" class="tutorial-controls-hud">
      <div class="hud-controls-title"><svg class="svg-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px;"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1" fill="#a855f7"/><circle cx="18" cy="11" r="1" fill="#a855f7"/></svg>CONTROLES</div>
      <!-- Versión PC -->
      <div class="hud-pc-controls">
        <div class="hud-control-row">
          <span class="hud-kbd-group">
            <span class="hud-kbd">W</span><span class="hud-kbd">A</span><span class="hud-kbd">S</span><span class="hud-kbd">D</span>
          </span>
          <span class="hud-control-desc">Moverse</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd hud-kbd-space">Espacio</span>
          <span class="hud-control-desc">Saltar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd">E</span><span style="opacity:0.5;font-size:9px;">/</span><span class="hud-kbd">F</span>
          <span class="hud-control-desc">Acción / Bajar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-kbd">B</span>
          <span class="hud-control-desc">Ver Botín</span>
        </div>
      </div>
      <!-- Versión Táctil (Móvil / Tablet) -->
      <div class="hud-touch-controls">
        <div class="hud-control-row">
          <span class="hud-touch-pill"><svg class="svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px;"><path d="M5 19a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2H5v-2z"/><circle cx="12" cy="6" r="3"/><line x1="12" y1="9" x2="12" y2="17"/></svg>Joystick</span>
          <span class="hud-control-desc">Moverse</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill">SALTAR</span>
          <span class="hud-control-desc">Brincar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill hud-pill-action">USAR</span>
          <span class="hud-control-desc">Acción / Bajar</span>
        </div>
        <div class="hud-control-row">
          <span class="hud-touch-pill"><svg class="svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;vertical-align:-2px;"><path d="M3 10c0-4.5 4-6.5 9-6.5s9 2 9 6.5v1H3v-1zM3 11v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8H3zM7 5.5v15.5M17 5.5v15.5M10 10h4v4h-4z"/><circle cx="12" cy="12" r="0.6" fill="#f59e0b"/></svg>BOTÍN</span>
          <span class="hud-control-desc">Tocar para abrir</span>
        </div>
      </div>
    </div>
  </div>
  <div id="level-transition"></div>
  <div id="pc-hint" class="input-hint">
    <strong>WASD</strong> mover · <strong>Espacio</strong> saltar · <strong>E</strong> interactuar / bajar · <strong>Click</strong> mirar · <strong>Esc</strong> menú
  </div>
  <button class="action-btn dim" id="btn-interact" title="Interactuar">
    <span class="ab-icon" id="interact-icon"><svg class="svg-icon" width="24" height="24" viewBox="0 0 24 24" fill="#fde68a" stroke="none"><path d="M12 2l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16l-5.8 3.7 1.6-6.6L2.7 8.7l6.7-.5L12 2z"/></svg></span>
    <span class="ab-label" id="interact-label">USAR</span>
  </button>
  <button class="action-btn" id="btn-jump" title="Saltar">
    <span class="ab-icon"><svg class="svg-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><polyline points="18 15 12 9 6 15" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="21" stroke-linecap="round"/></svg></span>
    <span class="ab-label">SALTAR</span>
  </button>
  <div id="ui"></div>
  <div id="hud-message"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
