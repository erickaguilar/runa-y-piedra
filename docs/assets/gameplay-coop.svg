<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Degradados de iluminación y ambiente -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="60%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#171318"/>
    </linearGradient>

    <radialGradient id="lavaGlow" cx="50%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#e65100" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="doorRuneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="doorStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="goldKeyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="jumpBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lavaRiver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Sombras y filtros -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      @keyframes runePulse {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes floatKey {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(4deg); }
      }
      @keyframes jumpParticle {
        0% { transform: translateY(0) scale(0.6); opacity: 0.9; }
        100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
      }
      @keyframes lavaBubble {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 0.95; }
      }
      @keyframes torchFlicker {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        25% { opacity: 1; transform: scale(1.08) translate(1px, -1px); }
        75% { opacity: 0.7; transform: scale(0.95) translate(-1px, 1px); }
      }
      .anim-rune { transform-origin: center; animation: runePulse 3s ease-in-out infinite; }
      .anim-key { transform-origin: center; animation: floatKey 2.4s ease-in-out infinite; }
      .anim-p1 { animation: jumpParticle 2s ease-out infinite; }
      .anim-p2 { animation: jumpParticle 2.5s ease-out infinite 0.8s; }
      .anim-p3 { animation: jumpParticle 1.8s ease-out infinite 1.3s; }
      .anim-bubble { transform-origin: center; animation: lavaBubble 2.2s ease-in-out infinite; }
      .anim-torch { transform-origin: center; animation: torchFlicker 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Fondo de la mazmorra -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect width="960" height="540" fill="url(#lavaGlow)"/>

  <!-- Vóxeles de pared y bóveda en perspectiva -->
  <g id="walls" opacity="0.45">
    <!-- Bloques superiores de cantería oscura -->
    <rect x="0" y="0" width="960" height="120" fill="#090d16"/>
    <line x1="0" y1="60" x2="960" y2="60" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="80,12"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#334155" stroke-width="2"/>
    
    <!-- Pilares laterales de piedra -->
    <path d="M0,0 L140,120 L140,460 L0,540 Z" fill="#0c121d" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M960,0 L820,120 L820,460 L960,540 Z" fill="#0c121d" stroke="#1e293b" stroke-width="1.5"/>
  </g>

  <!-- Antorchas de pared laterales -->
  <g id="torches">
    <!-- Antorcha Izquierda -->
    <rect x="135" y="210" width="8" height="34" fill="#573616" rx="2"/>
    <circle cx="139" cy="204" r="18" fill="#f59e0b" opacity="0.15" filter="url(#glowFilter)"/>
    <circle cx="139" cy="204" r="7" fill="#fbbf24" class="anim-torch"/>
    <circle cx="139" cy="202" r="3.5" fill="#fef08a" class="anim-torch"/>

    <!-- Antorcha Derecha -->
    <rect x="817" y="210" width="8" height="34" fill="#573616" rx="2"/>
    <circle cx="821" cy="204" r="18" fill="#f59e0b" opacity="0.15" filter="url(#glowFilter)"/>
    <circle cx="821" cy="204" r="7" fill="#fbbf24" class="anim-torch"/>
    <circle cx="821" cy="202" r="3.5" fill="#fef08a" class="anim-torch"/>
  </g>

  <!-- Fosa de Lava ardiente en el fondo (profundidad abismal) -->
  <g id="lavaChasm">
    <polygon points="140,440 820,440 850,540 110,540" fill="#2d0b07"/>
    <polygon points="170,455 790,455 830,540 130,540" fill="url(#lavaRiver)"/>
    <!-- Vetas de calor y burbujas de magma -->
    <ellipse cx="320" cy="495" rx="36" ry="10" fill="#fef08a" opacity="0.75" class="anim-bubble"/>
    <ellipse cx="640" cy="510" rx="42" ry="12" fill="#fef08a" opacity="0.8" class="anim-bubble" style="animation-delay: 1.1s;"/>
    <circle cx="280" cy="485" r="5" fill="#ffedd5" class="anim-bubble" style="animation-delay: 0.5s;"/>
    <circle cx="700" cy="490" r="6" fill="#ffedd5" class="anim-bubble" style="animation-delay: 1.6s;"/>
  </g>

  <!-- Plataforma central de cantería donde se mueven los jugadores -->
  <g id="stonePlatform" filter="url(#softShadow)">
    <polygon points="200,320 760,320 830,470 130,470" fill="#1e293b"/>
    <!-- Cuadrícula isométrica de baldosas de piedra -->
    <line x1="200" y1="320" x2="130" y2="470" stroke="#0f172a" stroke-width="3"/>
    <line x1="760" y1="320" x2="830" y2="470" stroke="#0f172a" stroke-width="3"/>
    <line x1="340" y1="320" x2="300" y2="470" stroke="#334155" stroke-width="1.8"/>
    <line x1="480" y1="320" x2="480" y2="470" stroke="#334155" stroke-width="1.8"/>
    <line x1="620" y1="320" x2="660" y2="470" stroke="#334155" stroke-width="1.8"/>
    <line x1="175" y1="370" x2="785" y2="370" stroke="#334155" stroke-width="1.8"/>
    <line x1="150" y1="420" x2="810" y2="420" stroke="#334155" stroke-width="1.8"/>
  </g>

  <!-- ELEMENTO CENTRAL 1: Puerta Autoritativa 2x2 con Runas -->
  <g id="coopDoor" transform="translate(400, 110)">
    <!-- Marco de piedra monumental -->
    <rect x="-10" y="-10" width="180" height="210" fill="#090d16" stroke="#475569" stroke-width="3" rx="4"/>
    <rect x="0" y="0" width="160" height="195" fill="url(#doorStone)"/>
    
    <!-- Hojas dobles correderas -->
    <rect x="4" y="4" width="74" height="187" fill="#182234" stroke="#334155" stroke-width="1.5"/>
    <rect x="82" y="4" width="74" height="187" fill="#182234" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="4" x2="80" y2="191" stroke="#0f172a" stroke-width="3"/>

    <!-- Cerradura y Cerrojo de Hierro con Ojo Rúnico -->
    <circle cx="80" cy="98" r="28" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <circle cx="80" cy="98" r="38" fill="url(#doorRuneGlow)" class="anim-rune"/>
    <!-- Glifo rúnico grabado -->
    <path d="M80,78 L80,118 M70,88 L90,88 M68,108 L92,108 M80,82 L92,94 L80,106 L68,94 Z" 
          stroke="#f5a623" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" class="anim-rune"/>
    <circle cx="80" cy="98" r="4" fill="#fef08a"/>

    <!-- Indicador de Interacción flotante -->
    <g transform="translate(80, -28)">
      <rect x="-70" y="0" width="140" height="24" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="0" y="16" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        [E] ABRIR PUERTA (2×2)
      </text>
    </g>
  </g>

  <!-- ELEMENTO 2: Jump Pad Rúnico (Plataforma de Salto) a la derecha -->
  <g id="jumpPad" transform="translate(710, 370)">
    <!-- Base de cantería oscura -->
    <ellipse cx="0" cy="18" rx="55" ry="24" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="0" cy="12" rx="48" ry="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Glifos rúnicos concéntricos de impulso -->
    <ellipse cx="0" cy="12" rx="36" ry="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,5"/>
    <ellipse cx="0" cy="12" rx="20" ry="8" fill="#0284c7" opacity="0.6"/>

    <!-- Haz de energía vertical ascendente -->
    <polygon points="-38,12 38,12 24,-130 -24,-130" fill="url(#jumpBeam)"/>
    
    <!-- Partículas ascendentes de propulsión -->
    <g class="anim-p1">
      <circle cx="-12" cy="0" r="3" fill="#bae6fd"/>
    </g>
    <g class="anim-p2">
      <circle cx="16" cy="-15" r="4" fill="#e0e7ff"/>
    </g>
    <g class="anim-p3">
      <circle cx="0" cy="-30" r="3.5" fill="#f3e8ff"/>
    </g>

    <!-- Rótulo del Jump Pad -->
    <g transform="translate(0, 52)">
      <rect x="-55" y="-12" width="110" height="22" rx="11" fill="rgba(15,23,42,0.92)" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="3" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
        JUMP PAD ⚡
      </text>
    </g>
  </g>

  <!-- ELEMENTO 3: Cofre de Tesoro y Llave Flotante a la izquierda -->
  <g id="lootChest" transform="translate(250, 360)">
    <!-- Sombra del cofre -->
    <ellipse cx="0" cy="22" rx="42" ry="16" fill="#070a12" opacity="0.8"/>
    <!-- Cuerpo del cofre de madera reforzada -->
    <rect x="-30" y="-8" width="60" height="28" fill="#5c2d13" stroke="#1f1209" stroke-width="2" rx="3"/>
    <!-- Bandas de hierro y remaches -->
    <rect x="-24" y="-8" width="6" height="28" fill="#475569"/>
    <rect x="18" y="-8" width="6" height="28" fill="#475569"/>
    <!-- Tapa abierta en ángulo con brillo interior -->
    <polygon points="-32,-8 32,-8 28,-26 -28,-26" fill="#78350f" stroke="#1f1209" stroke-width="1.8"/>
    <polygon points="-28,-8 28,-8 24,-22 -24,-22" fill="#d97706" opacity="0.65" filter="url(#glowFilter)"/>

    <!-- Llave mística dorada flotando fuera del cofre -->
    <g class="anim-key" transform="translate(0, -48)">
      <circle cx="0" cy="0" r="18" fill="url(#doorRuneGlow)"/>
      <path d="M-6,-14 A6,6 0 1,1 6,-14 A6,6 0 1,1 -6,-14 M0,-8 L0,14 M0,6 L6,6 M0,11 L4,11" 
            stroke="url(#goldKeyGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-14" r="2.5" fill="#fef08a"/>
    </g>

    <!-- Rótulo del Botín -->
    <g transform="translate(0, 44)">
      <rect x="-60" y="-12" width="120" height="22" rx="11" fill="rgba(15,23,42,0.92)" stroke="#eab308" stroke-width="1"/>
      <text x="0" y="3" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
        🔑 LLAVE DE MAZMORRA
      </text>
    </g>
  </g>

  <!-- JUGADOR 1: Host (Guardián con Armadura de Bloques) -->
  <g id="playerHost" transform="translate(365, 275)">
    <!-- Sombra en suelo -->
    <ellipse cx="0" cy="62" rx="22" ry="8" fill="#050810" opacity="0.7"/>

    <!-- Nametag 3D flotante -->
    <g transform="translate(0, -66)">
      <rect x="-66" y="0" width="132" height="24" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="-50" cy="12" r="5" fill="#3b82f6"/>
      <text x="8" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        Host (Guardián)
      </text>
      <!-- Indicador de señal P2P -->
      <path d="M52,9 L58,15 M55,9 L55,15" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Cuerpo Vóxel estilizado -->
    <!-- Cabeza / Casco con cuernos de acero -->
    <rect x="-14" y="-36" width="28" height="26" fill="#334155" stroke="#0f172a" stroke-width="1.8" rx="2"/>
    <rect x="-10" y="-24" width="20" height="6" fill="#0284c7"/> <!-- Visor resplandeciente -->
    <!-- Torso / Peto de placas -->
    <rect x="-18" y="-10" width="36" height="42" fill="#1e3a8a" stroke="#0f172a" stroke-width="2" rx="3"/>
    <rect x="-12" y="-4" width="24" height="28" fill="#2563eb" rx="2"/>
    <path d="M0,-2 L0,22" stroke="#93c5fd" stroke-width="2"/>
    <!-- Brazos y Escudo de torre -->
    <rect x="-26" y="-6" width="8" height="30" fill="#334155" rx="2"/>
    <!-- Escudo con blasón rúnico -->
    <g transform="translate(-32, -4)">
      <path d="M0,0 L20,0 L20,24 L10,34 L0,24 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <path d="M10,6 L10,26 M4,14 L16,14" stroke="#93c5fd" stroke-width="2"/>
    </g>
    <!-- Brazo derecho / Espada corta -->
    <rect x="18" y="-6" width="8" height="28" fill="#334155" rx="2"/>
    <line x1="22" y1="18" x2="34" y2="40" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <!-- Piernas vóxel -->
    <rect x="-14" y="32" width="12" height="28" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="2" y="32" width="12" height="28" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- JUGADOR 2: Invitado (Mago / Hechicero con Túnica Ámbar y Báculo) -->
  <g id="playerGuest" transform="translate(585, 275)">
    <!-- Sombra en suelo -->
    <ellipse cx="0" cy="62" rx="22" ry="8" fill="#050810" opacity="0.7"/>

    <!-- Nametag 3D flotante -->
    <g transform="translate(0, -66)">
      <rect x="-68" y="0" width="136" height="24" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="-52" cy="12" r="5" fill="#f59e0b"/>
      <text x="8" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        Invitado (Mago)
      </text>
      <!-- Indicador RTT < 5ms -->
      <text x="52" y="16" fill="#22c55e" font-family="monospace" font-size="9" font-weight="700">4ms</text>
    </g>

    <!-- Sombrero cónico de hechicero -->
    <polygon points="0,-48 -18,-28 18,-28" fill="#9a3412" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="0" cy="-28" rx="22" ry="6" fill="#7c2d12" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Cabeza -->
    <rect x="-12" y="-28" width="24" height="20" fill="#fed7aa" rx="2"/>
    <circle cx="-4" cy="-18" r="2" fill="#1e293b"/>
    <circle cx="4" cy="-18" r="2" fill="#1e293b"/>
    <!-- Túnica mágica con ribetes dorados -->
    <polygon points="-16,-6 16,-6 24,58 -24,58" fill="#c2410c" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="-6,-6 6,-6 10,58 -10,58" fill="#ea580c"/>
    <line x1="0" y1="-6" x2="0" y2="58" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Brazo izquierdo extendido -->
    <rect x="-24" y="-4" width="8" height="26" fill="#9a3412" rx="2" transform="rotate(20 -20 8)"/>
    <!-- Brazo derecho sosteniendo Báculo de Fuego -->
    <rect x="16" y="-4" width="8" height="26" fill="#9a3412" rx="2"/>
    <!-- Báculo místico -->
    <line x1="24" y1="-32" x2="24" y2="58" stroke="#78350f" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Orbe rúnico de fuego en la punta del báculo -->
    <circle cx="24" cy="-36" r="16" fill="url(#lavaGlow)"/>
    <circle cx="24" cy="-36" r="8" fill="#f59e0b" class="anim-torch"/>
    <circle cx="24" cy="-36" r="4" fill="#fef08a" class="anim-torch"/>
  </g>

  <!-- MARCO DE HUD SUPERIOR (Overlays de juego en vivo) -->
  <g id="hudOverlay" transform="translate(24, 24)">
    <!-- Barra superior de estado (Vidas con Contorno, Llave y Gemas) -->
    <rect x="0" y="0" width="290" height="48" rx="14" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Botón de inventario compacto -->
    <rect x="10" y="8" width="32" height="32" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <!-- Icono Cofre / Botín -->
    <path d="M16,18 L36,18 L34,32 L18,32 Z" fill="#f59e0b"/>
    <rect x="14" y="16" width="24" height="4" fill="#d97706" rx="1"/>

    <!-- 3 Corazones (2 llenos carmesí, 1 contorno vacío de vida perdida) -->
    <g transform="translate(56, 15)">
      <!-- Corazón 1 (Lleno) -->
      <path d="M8,4 A4,4 0 0,0 1,10 L8,17 L15,10 A4,4 0 0,0 8,4 Z" fill="#ef4444"/>
      <!-- Corazón 2 (Lleno) -->
      <path d="M28,4 A4,4 0 0,0 21,10 L28,17 L35,10 A4,4 0 0,0 28,4 Z" fill="#ef4444"/>
      <!-- Corazón 3 (Contorno - Vida perdida) -->
      <path d="M48,4 A4,4 0 0,0 41,10 L48,17 L55,10 A4,4 0 0,0 48,4 Z" fill="none" stroke="#64748b" stroke-width="1.8"/>
    </g>

    <!-- Insignia de Llave activa -->
    <g transform="translate(132, 12)">
      <circle cx="12" cy="12" r="12" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
      <path d="M8,9 A3,3 0 1,1 14,9 A3,3 0 1,1 8,9 M11,12 L11,18 M11,15 L14,15" stroke="#fbbf24" stroke-width="1.6" fill="none"/>
    </g>

    <!-- Contador de Gemas -->
    <g transform="translate(170, 14)">
      <polygon points="10,2 18,7 18,15 10,20 2,15 2,7" fill="#06b6d4" stroke="#22d3ee" stroke-width="1"/>
      <text x="26" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">
        450
      </text>
    </g>

    <!-- Badge P2P 60 FPS -->
    <g transform="translate(230, 14)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="25" y="14" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">60 FPS</text>
    </g>
  </g>

  <!-- BADGE INFERIOR: Arquitectura Listen-Server P2P Dual Channel -->
  <g transform="translate(480, 506)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="rgba(11, 17, 32, 0.92)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>
    <circle cx="-215" cy="0" r="5" fill="#22c55e"/>
    <text x="0" y="5" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="800">WebRTC P2P</tspan> · Latencia LAN &lt; 5 ms · Zero-GC Binary Protocol · Coste Servidor = $0
    </text>
  </g>
</svg>
