<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Degradados -->
    <linearGradient id="phoneBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1822"/>
    </linearGradient>

    <linearGradient id="btnAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="btnJump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="phoneShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes toastSlide {
        0% { transform: translateY(-10px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .anim-toast { animation: toastSlide 0.6s ease-out forwards; }
    </style>
  </defs>

  <!-- Fondo exterior general -->
  <rect width="960" height="540" fill="#030712"/>
  <circle cx="480" cy="270" r="380" fill="#1e293b" opacity="0.15"/>

  <!-- ===== DISPOSITIVO MÓVIL (Landscape Frame) ===== -->
  <g id="device" filter="url(#phoneShadow)">
    <!-- Bisel exterior del teléfono -->
    <rect x="70" y="30" width="820" height="480" rx="36" fill="url(#phoneBorder)" stroke="#334155" stroke-width="2"/>
    <!-- Cristal / Pantalla táctil -->
    <rect x="88" y="46" width="784" height="448" rx="26" fill="url(#screenBg)"/>
    
    <!-- Notch de cámara frontal (a la izquierda en landscape) -->
    <rect x="74" y="246" width="6" height="48" rx="3" fill="#090d16"/>
    <circle cx="77" cy="270" r="2" fill="#1e293b"/>
  </g>

  <!-- ===== RENDERIZADO 3D DENTRO DE LA PANTALLA ===== -->
  <g id="screenContent" clip-path="url(#screenClip)">
    <clipPath id="screenClip">
      <rect x="88" y="46" width="784" height="448" rx="26"/>
    </clipPath>

    <!-- Perspectiva de mazmorra 3D en primera persona -->
    <polygon points="88,46 872,46 580,240 380,240" fill="#0f172a" opacity="0.7"/>
    <polygon points="88,494 872,494 580,290 380,290" fill="#1e293b"/>
    <polygon points="88,46 88,494 380,290 380,240" fill="#141c2e"/>
    <polygon points="872,46 872,494 580,290 580,240" fill="#141c2e"/>

    <!-- Baldosas de suelo en perspectiva -->
    <line x1="88" y1="494" x2="380" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="280" y1="494" x2="430" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="480" y1="494" x2="480" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="680" y1="494" x2="530" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="872" y1="494" x2="580" y2="290" stroke="#334155" stroke-width="1.5"/>
    <line x1="160" y1="430" x2="800" y2="430" stroke="#334155" stroke-width="1.5"/>
    <line x1="260" y1="360" x2="700" y2="360" stroke="#334155" stroke-width="1.5"/>

    <!-- Puerta rúnica al final del pasillo en 3D -->
    <g transform="translate(440, 205)">
      <rect x="0" y="0" width="80" height="90" fill="#0b0f19" stroke="#d97706" stroke-width="2"/>
      <circle cx="40" cy="45" r="16" fill="rgba(245, 158, 11, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M40,35 L40,55 M32,45 L48,45" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- Crosshair / Retícula central -->
    <g transform="translate(480, 270)">
      <circle cx="0" cy="0" r="3" fill="#f8fafc" opacity="0.85"/>
      <line x1="-10" y1="0" x2="-4" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="4" y1="0" x2="10" y2="0" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="0" y1="-10" x2="0" y2="-4" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="0" y1="4" x2="0" y2="10" stroke="#f8fafc" stroke-width="1.5"/>
    </g>

    <!-- ===== NOTIFICACIÓN NARRATIVA HUD ===== -->
    <g class="anim-toast" transform="translate(480, 75)">
      <rect x="-180" y="0" width="360" height="34" rx="17" fill="rgba(15, 23, 42, 0.94)" stroke="#f59e0b" stroke-width="1.4" filter="url(#hudShadow)"/>
      <text x="0" y="21" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
        🗝️ ¡Has abierto el Cofre Ancestral! Llave obtenida.
      </text>
    </g>

    <!-- ===== HUD SUPERIOR IZQUIERDO (VIDAS, BOTÍN, GEMAS) ===== -->
    <g transform="translate(108, 62)">
      <!-- Fila superior: Botón inventario y vidas -->
      <g filter="url(#hudShadow)">
        <rect x="0" y="0" width="220" height="42" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>
        
        <!-- Botón Inventario / Botín -->
        <rect x="6" y="6" width="30" height="30" rx="7" fill="#334155" stroke="#475569" stroke-width="1"/>
        <path d="M12,14 L30,14 L28,28 L14,28 Z" fill="#f59e0b"/>
        <rect x="10" y="12" width="22" height="3" fill="#d97706" rx="1"/>

        <!-- Vidas con contorno -->
        <g transform="translate(48, 12)">
          <path d="M7,3 A3.5,3.5 0 0,0 1,8 L7,14 L13,8 A3.5,3.5 0 0,0 7,3 Z" fill="#ef4444"/>
          <path d="M23,3 A3.5,3.5 0 0,0 17,8 L23,14 L29,8 A3.5,3.5 0 0,0 23,3 Z" fill="#ef4444"/>
          <!-- Vida 3 (Contorno vacante) -->
          <path d="M39,3 A3.5,3.5 0 0,0 33,8 L39,14 L45,8 A3.5,3.5 0 0,0 39,3 Z" fill="none" stroke="#64748b" stroke-width="1.6"/>
        </g>

        <!-- Llave dorada activa -->
        <circle cx="120" cy="21" r="10" fill="rgba(245, 158, 11, 0.25)"/>
        <path d="M116,18 A2.5,2.5 0 1,1 121,18 M118.5,20.5 L118.5,25 M118.5,23 L121,23" stroke="#fbbf24" stroke-width="1.4" fill="none"/>

        <!-- Gemas -->
        <polygon points="146,14 152,18 152,24 146,28 140,24 140,18" fill="#06b6d4"/>
        <text x="160" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">
          320
        </text>
      </g>

      <!-- ===== NUEVO PANEL SUPERPUESTO DE CONTROLES (DISMISSIBLE UX) ===== -->
      <g transform="translate(0, 50)" filter="url(#hudShadow)">
        <rect x="0" y="0" width="186" height="118" rx="12" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2"/>
        
        <!-- Cabecera del Panel con Botón [H] y Cerrar (x) -->
        <g transform="translate(10, 16)">
          <circle cx="5" cy="0" r="4" fill="#a855f7"/>
          <text x="14" y="4" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">
            CONTROLES
          </text>
          <text x="86" y="4" fill="#94a3b8" font-family="monospace" font-size="8" font-weight="600">
            [H]
          </text>
          <!-- Botón Cerrar (x) interactivo -->
          <circle cx="160" cy="0" r="8" fill="#334155"/>
          <text x="160" y="3" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">×</text>
        </g>

        <!-- Filas de controles táctiles adaptativos -->
        <g transform="translate(10, 36)">
          <!-- Fila 1: Joystick Moverse -->
          <rect x="0" y="0" width="58" height="16" rx="8" fill="#334155"/>
          <text x="29" y="11" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">JOYSTICK</text>
          <text x="70" y="11" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Moverse</text>

          <!-- Fila 2: Botón SALTAR -->
          <rect x="0" y="20" width="58" height="16" rx="8" fill="#1e3a8a"/>
          <text x="29" y="31" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SALTAR</text>
          <text x="70" y="31" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Brincar</text>

          <!-- Fila 3: Botón USAR / Acción -->
          <rect x="0" y="40" width="58" height="16" rx="8" fill="#78350f"/>
          <text x="29" y="51" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">USAR</text>
          <text x="70" y="51" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Interactuar</text>

          <!-- Fila 4: Botón BOTÍN -->
          <rect x="0" y="60" width="58" height="16" rx="8" fill="#4c1d95"/>
          <text x="29" y="71" fill="#ddd6fe" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">BOTÍN</text>
          <text x="70" y="71" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Ver inventario</text>
        </g>
      </g>
    </g>

    <!-- ===== HUD SUPERIOR DERECHO (CONFIGURACIÓN Y DEV) ===== -->
    <g transform="translate(800, 62)">
      <!-- Botón Configuración ⚙️ -->
      <circle cx="16" cy="16" r="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
      <!-- Icono Rueda Dentada -->
      <circle cx="16" cy="16" r="6" fill="none" stroke="#e2e8f0" stroke-width="2"/>
      <path d="M16,7 L16,10 M16,22 L16,25 M7,16 L10,16 M22,16 L25,16" stroke="#e2e8f0" stroke-width="2"/>
    </g>

    <!-- ===== CONTROLES TÁCTILES IN-GAME (ZONA INFERIOR) ===== -->

    <!-- 1. Joystick Dinámico Virtual Nipple.js (Lado Izquierdo) -->
    <g id="touchJoystick" transform="translate(190, 390)">
      <!-- Anillo base translúcido -->
      <circle cx="0" cy="0" r="54" fill="rgba(51, 65, 85, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
      <!-- Pomo central desplazado simulando movimiento hacia arriba/derecha -->
      <circle cx="18" cy="-14" r="26" fill="rgba(56, 189, 248, 0.55)" stroke="#38bdf8" stroke-width="2" filter="url(#hudShadow)"/>
      <circle cx="18" cy="-14" r="8" fill="#ffffff" opacity="0.9"/>
      <!-- Flechas direccionales cardinales -->
      <path d="M0,-42 L0,-48 M0,42 L0,48 M-42,0 L-48,0 M42,0 L48,0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
        ZONA MOVIMIENTO (JOYSTICK)
      </text>
    </g>

    <!-- 2. Zona Central: Touch Look pasivo (Mirar / Girar a 60–120 Hz) -->
    <g transform="translate(480, 440)">
      <rect x="-90" y="-12" width="180" height="24" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="0" y="4" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">
        Arrastrar para mirar (Touch Look)
      </text>
    </g>

    <!-- 3. Botones Flotantes de Acción (Lado Derecho) -->
    <g id="touchActionButtons" transform="translate(760, 380)">
      <!-- Botón ACCION / USAR (Ámbar) -->
      <g transform="translate(-70, -20)" filter="url(#hudShadow)">
        <circle cx="0" cy="0" r="32" fill="url(#btnAmber)" stroke="#fde68a" stroke-width="2"/>
        <!-- Icono Estrella / Acción -->
        <polygon points="0,-14 4,-4 14,-2 6,6 8,16 0,10 -8,16 -6,6 -14,-2 -4,-4" fill="#fef3c7"/>
        <text x="0" y="24" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" text-anchor="middle">USAR</text>
      </g>

      <!-- Botón SALTAR (Azul / Blanco) -->
      <g transform="translate(0, 10)" filter="url(#hudShadow)">
        <circle cx="0" cy="0" r="34" fill="url(#btnJump)" stroke="#bfdbfe" stroke-width="2"/>
        <!-- Chevron hacia arriba -->
        <polyline points="-12,4 0,-8 12,4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="0" y1="-8" x2="0" y2="12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <text x="0" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" text-anchor="middle">SALTAR</text>
      </g>
    </g>
  </g>

  <!-- CALLOUTS & TELEMETRÍA (Detalles de Arquitectura & UX) -->
  <g transform="translate(70, 522)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">
      ⚡ 60 FPS estables · DPR ≤ 1.5 · Físicas desacopladas a 30 Hz · Nipple.js + Touch Look a 120 Hz · Panel de controles superpuesto
    </text>
  </g>
</svg>
