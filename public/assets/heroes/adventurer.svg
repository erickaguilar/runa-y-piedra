<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">
  <!-- Fondo base piel pergamino Washi -->
  <rect width="32" height="32" fill="#d6cfc2"/>

  <!-- Contorno perimetral de tinta negra (1px Sumi-e) -->
  <path d="M0,0 H32 V32 H0 Z M1,1 V31 H31 V1 Z" fill="#0c0a09"/>

  <!-- Sombras laterales de pómulos y oclusión inferior para empalmar con la bufanda marrón -->
  <rect x="1" y="10" width="3" height="21" fill="#bfb6a6"/>
  <rect x="28" y="10" width="3" height="21" fill="#a8a29e"/>
  <rect x="1" y="27" width="30" height="4" fill="#a8a29e"/>
  <rect x="3" y="29" width="26" height="2" fill="#78716c"/>

  <!-- CABELLO CASTAÑO DESPEINADO (Empalma con el bloque marrón superior) -->
  <!-- Sombra de tinta negra bajo los mechones del flequillo -->
  <path d="M1,1 H31 V10 H28 V8 H25 V10 H21 V7 H17 V10 H13 V8 H8 V10 H4 V12 H1 Z" fill="#0c0a09"/>
  <!-- Masa principal castaño oscuro (#2e1909 y #451a03) -->
  <path d="M1,1 H31 V8 H28 V6 H25 V8 H21 V5 H17 V8 H13 V6 H8 V8 H4 V10 H1 Z" fill="#2e1909"/>
  <path d="M2,1 H30 V6 H26 V7 H22 V4 H16 V7 H12 V5 H7 V7 H3 V8 H2 Z" fill="#451a03"/>
  <!-- Reflejos de luz en el cabello (#78350f) -->
  <g fill="#78350f">
    <rect x="4" y="2" width="5" height="2"/>
    <rect x="12" y="2" width="6" height="1"/>
    <rect x="22" y="2" width="5" height="2"/>
  </g>

  <!-- Patillas cortas de aventurero -->
  <rect x="1" y="10" width="2" height="5" fill="#0c0a09"/>
  <rect x="2" y="10" width="1" height="4" fill="#2e1909"/>
  <rect x="29" y="10" width="2" height="5" fill="#0c0a09"/>
  <rect x="29" y="10" width="1" height="4" fill="#2e1909"/>

  <!-- Sombra suave sobre la frente -->
  <rect x="4" y="9" width="24" height="1" fill="#a8a29e"/>

  <!-- CEJAS EXPRESIVAS EN CASTAÑO Y TINTA -->
  <path d="M6,11 H12 V13 H6 Z" fill="#0c0a09"/>
  <path d="M20,11 H26 V13 H20 Z" fill="#0c0a09"/>
  <rect x="6" y="11" width="5" height="1" fill="#451a03"/>
  <rect x="21" y="11" width="5" height="1" fill="#451a03"/>

  <!-- OJOS DE AVENTURERO (Tinta negra + Iris Azul Cian de Brújula) -->
  <rect x="6" y="14" width="5" height="5" fill="#0c0a09"/>
  <rect x="21" y="14" width="5" height="5" fill="#0c0a09"/>
  <!-- Esclerótica -->
  <rect x="7" y="15" width="4" height="4" fill="#f4efe4"/>
  <rect x="21" y="15" width="4" height="4" fill="#f4efe4"/>
  <!-- Iris azul cian (su color de clase) -->
  <rect x="8" y="15" width="3" height="4" fill="#0369a1"/>
  <rect x="22" y="15" width="3" height="4" fill="#0369a1"/>
  <rect x="8" y="16" width="2" height="3" fill="#38bdf8"/>
  <rect x="22" y="16" width="2" height="3" fill="#38bdf8"/>
  <!-- Brillo especular blanco -->
  <rect x="7" y="15" width="2" height="2" fill="#ffffff"/>
  <rect x="21" y="15" width="2" height="2" fill="#ffffff"/>

  <!-- Nariz definida -->
  <rect x="15" y="16" width="2" height="4" fill="#bfb6a6"/>
  <rect x="14" y="19" width="4" height="2" fill="#a8a29e"/>
  <rect x="15" y="20" width="2" height="1" fill="#78716c"/>

  <!-- DETALLE DE CARÁCTER: Parche / Tirita cruzada en la mejilla derecha -->
  <rect x="22" y="20" width="6" height="3" fill="#78716c"/>
  <rect x="23" y="20" width="4" height="2" fill="#f4efe4"/>
  <rect x="24" y="20" width="2" height="2" fill="#e7ded0"/>

  <!-- Rubor / Polvo de mazmorra en la mejilla izquierda -->
  <rect x="5" y="20" width="3" height="2" fill="#a8a29e"/>

  <!-- BOCA VALIENTE CON LIGERA SONRISA -->
  <path d="M11,23 H13 V24 H20 V26 H12 V25 H11 Z" fill="#0c0a09"/>
  <rect x="12" y="24" width="7" height="1" fill="#7f1d1d"/>
  <!-- Diente / Brillo de sonrisa confiada -->
  <rect x="12" y="24" width="2" height="1" fill="#f4efe4"/>
  <!-- Sombra bajo el labio -->
  <rect x="14" y="27" width="4" height="1" fill="#78716c"/>
</svg>
