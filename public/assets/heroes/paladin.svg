<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">
  <!-- Fondo base piel pergamino Washi -->
  <rect width="32" height="32" fill="#d6cfc2"/>

  <!-- Contorno perimetral de tinta negra (1px Sumi-e) -->
  <path d="M0,0 H32 V32 H0 Z M1,1 V31 H31 V1 Z" fill="#0c0a09"/>

  <!-- Sombras de aguada en el rostro bajo el yelmo -->
  <rect x="5" y="9" width="22" height="2" fill="#78716c"/>
  <rect x="5" y="11" width="22" height="1" fill="#a8a29e"/>
  <rect x="5" y="26" width="22" height="5" fill="#bfb6a6"/>
  <rect x="8" y="28" width="16" height="3" fill="#a8a29e"/>

  <!-- YELMO DE ACERO FORJADO (Empalma con el bloque gris superior y laterales) -->
  <!-- Contorno interior negro del yelmo y guardamejillas -->
  <path d="M1,1 H31 V23 H26 V11 H18 V17 H14 V11 H6 V23 H1 Z" fill="#0c0a09"/>

  <!-- Base de acero oscuro (#52525b) -->
  <path d="M1,1 H31 V21 H27 V10 H17 V16 H15 V10 H5 V21 H1 Z" fill="#52525b"/>

  <!-- Placas iluminadas de acero bruñido (#71717a y #a1a1aa) -->
  <path d="M2,1 H30 V8 H28 V19 H27 V9 H17 V15 H15 V9 H5 V19 H4 V8 H2 Z" fill="#71717a"/>
  <rect x="3" y="2" width="26" height="4" fill="#a1a1aa"/>
  <rect x="4" y="2" width="24" height="1" fill="#e4e4e7"/>

  <!-- Filo Dorado Sagrado en la visera y el protector nasal -->
  <g fill="#d97706">
    <rect x="5" y="8" width="10" height="1"/>
    <rect x="17" y="8" width="10" height="1"/>
    <rect x="15" y="6" width="2" height="9"/>
  </g>
  <rect x="15" y="4" width="2" height="2" fill="#991b1b"/> <!-- Engaste del penacho rojo -->
  <rect x="15" y="7" width="1" height="7" fill="#fef08a"/>

  <!-- Remaches del yelmo y rasguños de pincel seco (Kasure) -->
  <g fill="#18181b">
    <rect x="3" y="4" width="1" height="1"/><rect x="28" y="4" width="1" height="1"/>
    <rect x="2" y="13" width="2" height="1"/><rect x="28" y="13" width="2" height="1"/>
    <rect x="2" y="17" width="2" height="1"/><rect x="28" y="17" width="2" height="1"/>
  </g>

  <!-- CEJAS NOBLES Y SEVERAS -->
  <rect x="7" y="12" width="6" height="2" fill="#292524"/>
  <rect x="19" y="12" width="6" height="2" fill="#292524"/>
  <rect x="8" y="12" width="4" height="1" fill="#57534e"/>
  <rect x="20" y="12" width="4" height="1" fill="#57534e"/>

  <!-- OJOS DE PALADÍN (Tinta negra + Iris Azul Celestial / Luz) -->
  <rect x="7" y="14" width="5" height="5" fill="#0c0a09"/>
  <rect x="20" y="14" width="5" height="5" fill="#0c0a09"/>
  <!-- Esclerótica -->
  <rect x="8" y="15" width="4" height="4" fill="#f4efe4"/>
  <rect x="20" y="15" width="4" height="4" fill="#f4efe4"/>
  <!-- Iris azul real templario -->
  <rect x="9" y="15" width="3" height="4" fill="#1d4ed8"/>
  <rect x="21" y="15" width="3" height="4" fill="#1d4ed8"/>
  <rect x="9" y="16" width="2" height="3" fill="#38bdf8"/>
  <rect x="21" y="16" width="2" height="3" fill="#38bdf8"/>
  <!-- Destello blanco de fe -->
  <rect x="8" y="15" width="2" height="2" fill="#ffffff"/>
  <rect x="20" y="15" width="2" height="2" fill="#ffffff"/>

  <!-- Pómulos y base de la nariz bajo el protector nasal -->
  <rect x="14" y="18" width="4" height="3" fill="#bfb6a6"/>
  <rect x="14" y="20" width="4" height="1" fill="#78716c"/>
  <!-- Cicatriz vertical de honor en el pómulo izquierdo -->
  <rect x="8" y="20" width="1" height="4" fill="#a8a29e"/>
  <rect x="9" y="20" width="1" height="4" fill="#f4efe4"/>

  <!-- BOCA FIRME Y MENTÓN CUADRADO -->
  <rect x="12" y="24" width="8" height="2" fill="#451a03"/>
  <rect x="12" y="24" width="8" height="1" fill="#0c0a09"/>
  <!-- Hoyuelo / sombra de mentón heroico -->
  <rect x="15" y="27" width="2" height="2" fill="#78716c"/>

  <!-- Barba de candado corta / Sombra de mandíbula en gris acero -->
  <path d="M5,23 H7 V28 H11 V30 H21 V28 H25 V23 H27 V31 H5 Z" fill="#78716c"/>
  <rect x="11" y="29" width="10" height="2" fill="#57534e"/>
</svg>
