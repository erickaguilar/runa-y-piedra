<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">
  <!-- Fondo base piel pergamino Washi -->
  <rect width="32" height="32" fill="#d6cfc2"/>

  <!-- Borde perimetral de tinta negra -->
  <path d="M0,0 H32 V32 H0 Z M1,1 V31 H31 V1 Z" fill="#0c0a09"/>

  <!-- Sombra de aguada en mejillas y mentón -->
  <rect x="1" y="26" width="30" height="5" fill="#a8a29e"/>
  <rect x="1" y="13" width="3" height="18" fill="#bfb6a6"/>
  <rect x="28" y="13" width="3" height="18" fill="#a8a29e"/>

  <!-- CORONA REAL (Parte superior y=0 a 12) -->
  <!-- Huecos oscuros entre almenas -->
  <rect x="1" y="1" width="30" height="4" fill="#1c1917"/>
  <!-- Cuerpo de oro viejo de la corona -->
  <path d="M1,1 H6 V5 H12 V1 H20 V5 H26 V1 H31 V12 H1 Z" fill="#b45309"/>
  <path d="M2,2 H5 V6 H13 V2 H19 V6 H27 V2 H30 V10 H2 Z" fill="#d97706"/>
  <!-- Filo de luz superior en las almenas -->
  <g fill="#fef08a">
    <rect x="2" y="2" width="3" height="1"/>
    <rect x="13" y="2" width="6" height="1"/>
    <rect x="27" y="2" width="3" height="1"/>
    <rect x="2" y="9" width="28" height="1"/>
  </g>
  <!-- Línea de tinta divisoria bajo la corona y sombra sobre la frente -->
  <rect x="1" y="11" width="30" height="2" fill="#0c0a09"/>
  <rect x="1" y="13" width="30" height="2" fill="#78716c"/>

  <!-- Gema Central Bermellón (Sello Hanko en la corona) -->
  <rect x="13" y="3" width="6" height="7" fill="#0c0a09"/>
  <rect x="14" y="4" width="4" height="5" fill="#991b1b"/>
  <rect x="14" y="4" width="3" height="3" fill="#dc2626"/>
  <rect x="14" y="4" width="1" height="1" fill="#ffffff"/>

  <!-- ROSTRO CALIGRÁFICO -->
  <!-- Cejas severas de Guardián en trazo de pincel negro -->
  <rect x="6" y="16" width="6" height="2" fill="#0c0a09"/>
  <rect x="20" y="16" width="6" height="2" fill="#0c0a09"/>

  <!-- Ojos -->
  <rect x="7" y="18" width="4" height="4" fill="#0c0a09"/>
  <rect x="21" y="18" width="4" height="4" fill="#0c0a09"/>
  <!-- Esclerótica y pupila azul espiritual -->
  <rect x="7" y="18" width="2" height="2" fill="#ffffff"/>
  <rect x="21" y="18" width="2" height="2" fill="#ffffff"/>
  <rect x="9" y="20" width="2" height="2" fill="#0284c7"/>
  <rect x="23" y="20" width="2" height="2" fill="#0284c7"/>

  <!-- Boca firme y cicatriz de tinta -->
  <rect x="12" y="25" width="8" height="2" fill="#450a0a"/>
  <rect x="13" y="25" width="6" height="1" fill="#0c0a09"/>
  <!-- Pequeña cicatriz vertical en mejilla izquierda -->
  <rect x="24" y="23" width="1" height="4" fill="#78716c"/>
</svg>
