<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="runeInkW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5a623"/>
      <stop offset="60%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8a3f00"/>
    </linearGradient>
    <linearGradient id="stoneText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8e4d8"/>
      <stop offset="55%"  stop-color="#b8b0a0"/>
      <stop offset="100%" stop-color="#6a6358"/>
    </linearGradient>
  </defs>

  <!-- ===== Marca cuadrada reducida, a la izquierda ===== -->
  <g transform="translate(30, 40) scale(0.235)">
    <rect x="0" y="0" width="512" height="512" rx="28" fill="#0a0c10"/>
    <rect x="8" y="8" width="496" height="496" rx="22" fill="#252a32"/>
    <path d="M8 34 L8 482 Q8 504 30 504 L482 504 L482 488 L34 488 Q24 488 24 478 L24 34 Z"
          fill="#3d434c" opacity="0.55"/>
    <path d="M504 30 L504 478 Q504 500 482 500 L30 500 L30 484 L478 484 Q488 484 488 474 L488 30 Z"
          fill="#14181e" opacity="0.75"/>
    <circle cx="256" cy="256" r="180" fill="#d97706" opacity="0.07"/>
    <g fill="none" stroke="#0a0c10" stroke-width="16" stroke-linecap="square">
      <path d="M212 132 L212 380"/>
      <path d="M212 132 L322 172 L212 250"/>
    </g>
    <g fill="none" stroke="url(#runeInkW)" stroke-width="11" stroke-linecap="square">
      <path d="M214 134 L214 378"/>
      <path d="M214 134 L320 174 L214 248"/>
    </g>
    <g fill="none" stroke="#f5a623" stroke-width="2.4" stroke-linecap="square" opacity="0.75">
      <path d="M216 136 L216 376"/>
      <path d="M216 136 L318 175 L216 246"/>
    </g>
  </g>

  <!-- ===== Texto ===== -->
  <!-- "RUNA" en serif alto, letra pequeña (autoridad) -->
  <text x="170" y="105"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76"
        font-weight="700"
        letter-spacing="6"
        fill="url(#stoneText)">RUNA</text>

  <!-- "y" en cursiva, más pequeña, ámbar (acento) -->
  <text x="405" y="105"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="46"
        font-style="italic"
        fill="#d97706"
        opacity="0.9">y</text>

  <!-- "PIEDRA" alineada debajo -->
  <text x="170" y="165"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-weight="400"
        letter-spacing="14"
        fill="url(#stoneText)"
        opacity="0.92">PIEDRA</text>

  <!-- Línea de suelo (sutil, evoca sillar) -->
  <line x1="170" y1="178" x2="590" y2="178"
        stroke="#3d434c" stroke-width="1" opacity="0.5"/>
  <line x1="170" y1="180" x2="590" y2="180"
        stroke="#14181e" stroke-width="1" opacity="0.5"/>
</svg>
