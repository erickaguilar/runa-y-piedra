<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="runeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d97706" stop-opacity="0.40"/>
      <stop offset="65%"  stop-color="#d97706" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="runeInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5a623"/>
      <stop offset="55%"  stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8a3f00"/>
    </linearGradient>
  </defs>

  <!-- Bloque de piedra exterior (sombra dura) -->
  <rect x="40" y="40" width="432" height="432" rx="28" fill="#0a0c10"/>

  <!-- Bloque principal -->
  <rect x="48" y="48" width="416" height="416" rx="22" fill="#252a32"/>

  <!-- Bisel superior-izquierdo (luz cenital) -->
  <path d="M48 74 L48 442 Q48 464 70 464 L442 464 L442 448 L74 448 Q64 448 64 438 L64 74 Z"
        fill="#3d434c" opacity="0.55"/>

  <!-- Bisel inferior-derecho (sombra) -->
  <path d="M464 70 L464 438 Q464 460 442 460 L70 460 L70 444 L438 444 Q448 444 448 434 L448 70 Z"
        fill="#14181e" opacity="0.75"/>

  <!-- Grietas talladas (carácter + herencia ruina) -->
  <g stroke="#0a0c10" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M192 48 L200 76 L194 102 L204 124"/>
    <path d="M328 464 L320 436 L326 412 L316 388"/>
    <path d="M464 240 L438 246 L420 240"/>
  </g>
  <g stroke="#3d434c" stroke-width="0.8" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M194 50 L202 78 L196 104"/>
  </g>

  <!-- Halo ámbar contenido -->
  <circle cx="256" cy="256" r="180" fill="url(#runeGlow)"/>

  <!-- Runa Raido tallada: sombra interior (profundidad del grabado) -->
  <g fill="none" stroke="#0a0c10" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M212 132 L212 380"/>
    <path d="M212 132 L322 172 L212 250"/>
  </g>

  <!-- Runa Raido: tinta ámbar principal -->
  <g fill="none" stroke="url(#runeInk)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M214 134 L214 378"/>
    <path d="M214 134 L320 174 L214 248"/>
  </g>

  <!-- Brillo interior de la runa (sub-acento) -->
  <g fill="none" stroke="#f5a623" stroke-width="2.4" stroke-linecap="square" opacity="0.75">
    <path d="M216 136 L216 376"/>
    <path d="M216 136 L318 175 L216 246"/>
  </g>

  <!-- Esquineros de hierro forjado -->
  <g fill="#27272a" stroke="#0a0c10" stroke-width="1.2">
    <circle cx="76" cy="76" r="7"/>
    <circle cx="436" cy="76" r="7"/>
    <circle cx="76" cy="436" r="7"/>
    <circle cx="436" cy="436" r="7"/>
  </g>
  <!-- Remaches dorados -->
  <g fill="#8a7a4a">
    <circle cx="74" cy="74" r="2.4"/>
    <circle cx="434" cy="74" r="2.4"/>
    <circle cx="74" cy="434" r="2.4"/>
    <circle cx="434" cy="434" r="2.4"/>
  </g>
</svg>
